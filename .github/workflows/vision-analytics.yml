# CI for projects/vision-analytics. Runs only when that project (or this file) changes.
name: vision-analytics
on:
  push:
    paths: ["projects/vision-analytics/**", ".github/workflows/vision-analytics.yml"]
  pull_request:
    paths: ["projects/vision-analytics/**", ".github/workflows/vision-analytics.yml"]

defaults:
  run:
    working-directory: projects/vision-analytics

jobs:
  ml-service:
    # Python: detector, tracker, analytics, video jobs, live WebSocket (fake ONNX model, no GPU)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: projects/vision-analytics/ml-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/vision-analytics/ml-service/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y libgl1
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check app inference tests      # rules in ../ruff.toml
      - run: pytest -q

  server:
    # Node/Express: storage, history, analytics, job polling, WebSocket relay (real MongoDB, fake ML service)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: projects/vision-analytics/server } }
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/vision-analytics/server/package-lock.json
      - run: npm ci
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: projects/vision-analytics/client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/vision-analytics/client/package-lock.json
      - run: npm ci
      - run: npx prettier --check "src/**/*.{js,jsx}"
      - run: npm run build

  docker:
    # Builds the real images and runs the whole stack (MongoDB + ML service + server/dashboard).
    # Trained weights are not in git, so a tiny generated ONNX model with the real YOLO
    # input/output signature is placed in models/ first (same one the unit tests use).
    runs-on: ubuntu-latest
    needs: [ml-service, server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r ml-service/requirements-dev.txt
      - name: Generate a fake model for the image
        working-directory: projects/vision-analytics/ml-service
        run: python -c "from tests.conftest import make_fake_model; from pathlib import Path; make_fake_model(Path('../models/fake.onnx'))"
      - run: docker compose build
      - run: docker compose up -d
        env: { VA_DEFAULT_MODEL: fake }
      - run: python scripts/docker_smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
