name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: sudo apt-get update && sudo apt-get install -y libgl1
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check app inference tests      # rules in ../ruff.toml
      - run: pytest -q          # uses a generated fake ONNX model: no weights or GPU needed

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    # Builds the real images and runs the whole stack (API container + PostgreSQL + dashboard).
    # Trained weights are not in git, so a tiny generated ONNX model with the real YOLO
    # input/output signature is placed in models/ first (same one the unit tests use).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - name: Generate a fake model for the image
        working-directory: backend
        run: python -c "from tests.conftest import make_fake_model; from pathlib import Path; make_fake_model(Path('../models/fake.onnx'))"
      - run: docker compose build
      - run: docker compose up -d
        env: { VA_DEFAULT_MODEL: fake }
      - run: python scripts/docker_smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
